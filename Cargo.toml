[workspace]
members = ["apps/android/native"]
exclude = ["qa/fuzz", "external/libp2p-webrtc"]
resolver = "2"

[package]
name = "p2p-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "BUSL-1.1"
description = "Shared libp2p node core with six app primitives, discovery, heartbeat gossip, NAT traversal, DCUtR, relay mediation, platform adapters, and binding helpers."
readme = "README.md"
keywords = ["libp2p", "p2p", "networking", "webrtc", "nat-traversal"]
categories = ["network-programming", "asynchronous"]
repository = "https://github.com/peavey2787/p2p-net"
homepage = "https://github.com/peavey2787/p2p-net"
documentation = "https://docs.rs/p2p-net"
publish = true
exclude = [
    ".cargo/**",
    "external/libp2p-dns/**",
    "external/libp2p-mdns-placeholder/**",
    "external/libp2p-webrtc/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["dns", "native-tests"]
# DNS is enabled by default through p2p-net's own bounded resolver. /dns,
# /dns4, /dns6 and /dnsaddr are resolved before dialing, including manual
# connect_peer calls. We intentionally do not enable libp2p's Hickory-backed
# dns/mdns features, which keeps the published dependency graph self-contained
# and avoids a hidden resolver policy.
dns = []
# Test-target selectors only; they do not enable production runtime code. Native
# tests stay available under ordinary `cargo test`. The browser release gate
# disables defaults and enables only `browser-tests`; wasm-pack builds the web
# package and Playwright executes the browser runtime checks.
native-tests = []
browser-tests = []
dashboard = ["dep:crossterm", "tokio/signal"]
webrtc-oob-probe = ["dep:webrtc"]
fuzzing = []

[profile.release]
lto = "thin"
codegen-units = 1

[lib]
name = "p2p_net"
path = "crates/lib.rs"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "p2p_node"
path = "apps/windows/p2p_node.rs"
required-features = ["dashboard"]
test = false
bench = false

[[example]]
name = "six_primitives"
path = "examples/six_primitives.rs"
test = false
bench = false

[[example]]
name = "live_webrtc_oob_probe"
path = "examples/live_webrtc_oob_probe.rs"
required-features = ["webrtc-oob-probe"]
