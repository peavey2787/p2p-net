[dependencies]
futures = "0.3"
either = "1"
# Keep the patched event-listener release in the manifest's resolution constraints.
# This crate is already transitive; the direct security floor makes Cargo.lock
# reproducible without relying on a hand-edited transitive package entry.
event-listener = ">=5.4.2, <6"
# RUSTSEC-2026-0258 affects h2 <=0.4.15. Keep the patched transitive
# HTTP/2 implementation in the manifest constraints so lock regeneration cannot
# silently resolve back to a vulnerable release.
h2 = ">=0.4.16, <0.5"
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "quic",
    "websocket",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "relay",
    "autonat",
    "dcutr",
    "rsa",
    "macros",
] }
libp2p-rendezvous = "0.17.1"
crossterm = { version = "0.28", optional = true, features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
tracing = "0.1"
blake3 = "1"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webrtc = { version = "0.12.0", optional = true }
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio"] }

[dev-dependencies]
base64 = "0.22"

[patch.crates-io]

# rust-libp2p's WebSocket builder expects libp2p-dns when WebSocket support
# is compiled. Patch libp2p-dns to a local no-Hickory adapter. Patch disallowed mDNS
# to a no-op placeholder so the rejected Hickory DNS parser/resolver line cannot
# enter Cargo.lock through optional metadata. p2p-net /dnsaddr support lives in
# crates/connectivity/dns.rs.
libp2p-dns = { path = "external/libp2p-dns" }
libp2p-dcutr = { path = "external/libp2p-dcutr" }
libp2p-mdns = { path = "external/libp2p-mdns-placeholder" }
libp2p-webrtc = { path = "external/libp2p-webrtc" }
