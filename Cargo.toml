[package]
name = "p2p-net"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Shared libp2p node core with six app primitives, discovery, heartbeat gossip, NAT traversal, DCUtR, relay mediation, platform adapters, and binding helpers."
publish = false

[features]
default = ["dns"]
# DNS is enabled by default through p2p-net's own bounded startup resolver plus
# a local no-Hickory libp2p-dns compatibility patch required by WebSocket.
# /dnsaddr is resolved before configured/cached dials through p2p-net's
# operator-configurable DoH path; the transport adapter rejects /dnsaddr so
# there is no hidden hard-coded third-party resolver.
# LAN multicast discovery/mDNS is intentionally not included.
dns = ["libp2p/dns"]
dashboard = ["dep:crossterm", "tokio/signal"]
webrtc-oob-probe = ["dep:webrtc"]

[profile.release]
lto = "thin"
codegen-units = 1

[lib]
name = "p2p_net"
path = "crates/lib.rs"

[[example]]
name = "p2p_node"
path = "examples/p2p_node.rs"
required-features = ["dashboard"]
test = false
bench = false

[[example]]
name = "six_primitives"
path = "examples/six_primitives.rs"
test = false
bench = false

[[example]]
name = "live_webrtc_oob_probe"
path = "examples/live_webrtc_oob_probe.rs"
required-features = ["webrtc-oob-probe"]
