[dependencies]
futures = "0.3"
either = "1"
# std::time::{Instant, SystemTime} panic on wasm32-unknown-unknown; web-time re-exports
# std on native and uses performance.now()/Date.now() in the browser.
web-time = "1.1"
# Keep the patched event-listener release in the manifest's resolution constraints.
# This crate is already transitive; the direct security floor makes Cargo.lock
# reproducible without relying on a hand-edited transitive package entry.
event-listener = ">=5.4.2, <6"
# RUSTSEC-2026-0258 affects h2 <=0.4.15. Keep the patched transitive
# HTTP/2 implementation in the manifest constraints so lock regeneration cannot
# silently resolve back to a vulnerable release.
h2 = ">=0.4.16, <0.5"
libp2p = { version = "0.57", default-features = false, features = [
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "relay",
    "autonat",
    "dcutr",
    "rsa",
    "macros",
    "serde",
] }
libp2p-rendezvous = "0.18.0"
crossterm = { version = "0.28", optional = true, features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
blake3 = "1"
rand = "0.8"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic"] }
libp2p-websocket = "0.46.0"
socket2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# libp2p-quic/libp2p-tls enable rustls' aws-lc-rs backend while dtls (WebRTC)
# enables ring. With both compiled in, rustls cannot pick a process-default
# CryptoProvider and dtls panics during the handshake, so the native transport
# installs one explicitly (see crates/stack/transport/native.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webrtc = { version = "0.17.0", optional = true }
# Security floor for the WebRTC 0.17 stack (SECURITY.md, bincode exit).
rkyv = { version = ">=0.8.18, <0.9", default-features = false }
libp2p-webrtc = { package = "p2p-net-webrtc", version = "0.1.0", path = "external/libp2p-webrtc", features = ["tokio", "pem"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
libp2p = { version = "0.57", default-features = false, features = ["webrtc-websys", "websocket-websys", "webtransport-websys"] }
# rust-libp2p 0.57 caps wasm-bindgen-futures at 0.4.58 because the
# corresponding wasm-bindgen ABI generation is 0.2.108 / js-sys 0.3.85.
# Consumer workspaces must align any direct WASM pins (including HYDRA-style
# companion crates) to this exact family; older =0.2.100/=0.3.77/=0.4.50 pins
# cannot coexist with the libp2p 0.57 browser graph.
# futures-timer 3.0.4 moved its WASM backend to gloo-timers 0.4.0, which
# requires js-sys >=0.3.91 and is therefore incompatible with that libp2p
# generation. Pin 3.0.3, whose WASM backend uses gloo-timers 0.2.6.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
serde-wasm-bindgen = "=0.6.5"
js-sys = "=0.3.85"
futures-timer = { version = "=3.0.3", features = ["wasm-bindgen"] }
getrandom = { version = "=0.2.17", features = ["js"] }
web-sys = { version = "=0.3.85", features = [
    "BroadcastChannel",
    "Crypto",
    "DomException",
    "Document",
    "Event",
    "EventTarget",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Navigator",
    "Performance",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "StorageManager",
    "Window",
    "VisibilityState",
] }

[dev-dependencies]
base64 = "0.22"
