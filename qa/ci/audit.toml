[advisories]
# Temporary, exact exception for one transitive unmaintained advisory whose
# maintained upstream replacement path is not released through our supported
# dependency families yet. New unmaintained advisories are release blockers.
ignore = ["RUSTSEC-2024-0436"]
informational_warnings = ["unmaintained", "unsound"]

[output]
# Vulnerabilities fail independently. Treat informational unsoundness and every
# unmaintained advisory except the explicit temporary exception above as
# release blockers.
deny = ["unmaintained", "unsound"]
format = "terminal"
quiet = false
show_tree = true
