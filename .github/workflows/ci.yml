name: p2p-net-ci

on:
  push:
  pull_request:

jobs:
  validation:
    name: stable-validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Full validation (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/run-full-validation.sh --skip-ignored
      - name: Full validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\run-full-validation.ps1 -SkipIgnored
