name: p2p-net-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: stable-validation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy && rustup default 1.98.0
      - name: Full validation (Unix)
        if: runner.os != 'Windows'
        run: bash ./run-full-validation.sh --skip-ignored --no-pause
      - name: Full validation (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: .\run-full-validation.cmd --skip-ignored --no-pause
