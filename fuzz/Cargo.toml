[package]
name = "p2p-net-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
p2p-net = { path = ".." }
serde_json = "1"

[[bin]]
name = "heartbeat_wire"
path = "fuzz_targets/heartbeat_wire.rs"
test = false
doc = false

[[bin]]
name = "node_config_json"
path = "fuzz_targets/node_config_json.rs"
test = false
doc = false

[[bin]]
name = "peer_cache_json"
path = "fuzz_targets/peer_cache_json.rs"
test = false
doc = false
