[package]
name = "p2p-net-webrtc"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["Parity Technologies <admin@parity.io>"]
description = "Hardened WebRTC-direct transport used by p2p-net, based on rust-libp2p WebRTC 0.9.0-alpha.1."
readme = "README.md"
keywords = ["peer-to-peer", "libp2p", "networking"]
categories = ["network-programming", "asynchronous"]
license = "MIT"
repository = "https://github.com/peavey2787/p2p-net"
homepage = "https://github.com/peavey2787/p2p-net"
documentation = "https://docs.rs/p2p-net-webrtc"
publish = true

[package.metadata.docs.rs]
all-features = true

[features]
fuzzing = ["tokio"]
pem = ["webrtc?/pem"]
tokio = [
    "dep:tokio",
    "dep:tokio-util",
    "dep:webrtc",
    "if-watch/tokio",
]

[lib]
name = "libp2p_webrtc"
path = "src/lib.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
required-features = ["tokio"]

[dependencies]
async-trait = "0.1"
futures = "0.3.30"
futures-timer = "3"
hex = "0.4"
if-watch = "3.2.1"
libp2p-core = "0.43.1"
libp2p-identity = "0.2.12"
libp2p-noise = "0.46.1"
libp2p-webrtc-utils = "0.4.0"
multihash = "0.19.1"
rand = "0.8"
rcgen = "0.13"
stun = "0.7"
thiserror = "2"
tracing = "0.1.41"

[dependencies.tokio]
version = "1.38"
features = ["net", "rt", "time"]
optional = true
default-features = false

[dependencies.tokio-util]
version = "0.7"
features = ["compat"]
optional = true

[dependencies.webrtc]
version = "0.12.0"
optional = true

[dev-dependencies.libp2p-identity]
version = "0.2.12"
features = ["rand"]

[dev-dependencies.tokio]
version = "1.38"
features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"]
default-features = false

[lints.clippy]
dbg_macro = "warn"
manual_let_else = "warn"
type_complexity = "allow"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"

[lints.clippy.pedantic]
level = "allow"
priority = -1

[lints.rust]
unreachable_pub = "warn"
